services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: wellio
      POSTGRES_USER: wellio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellio_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wellio_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellio -d wellio"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://wellio:${POSTGRES_PASSWORD:-wellio_local}@postgres:5432/wellio
      WELLIO_PUBLIC_ORIGIN: ${WELLIO_PUBLIC_ORIGIN:-http://127.0.0.1:3100,http://localhost:3100}
      WELLIO_ATTACHMENTS_PATH: /data/attachments
      WELLIO_COOKIE_SECURE: ${WELLIO_COOKIE_SECURE:-0}
      EXA_API_KEY: ${EXA_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - wellio_attachments:/data
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  wellio_pg:
  wellio_attachments:
